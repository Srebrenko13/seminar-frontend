<div class="game-container">
  @switch (gameService.gameState()) {
    @case (Phase.COUNTDOWN) {
      <app-countdown [role]="role()"/>
    }
    @case (Phase.QUESTION) {
      @if (role() === 'screen') {
        <app-question-main/>
      } @else {
        <app-question-mobile/>
      }
    }
    @case (Phase.ROUND_RESULT) {
      <app-round-result/>
    }
    @case (Phase.GAME_END) {
      <app-game-ended/>
    }
  }
</div>
