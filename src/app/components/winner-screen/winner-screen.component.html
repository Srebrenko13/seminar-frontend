<div class="min-h-screen w-screen bg-linear-to-b from-[#1a2030] to-[#252a38] flex flex-col items-center justify-between overflow-hidden px-6 py-8">

    <!-- Logo -->
    <div class="text-center pt-12">
        <h1 class="text-6xl md:text-8xl font-bold tracking-wider text-[#19E6E8]">
            UPRO🗲DUEL
        </h1>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col items-center justify-center w-full max-w-3xl">

        <!-- Congratulations Title -->
        <h2 class="text-white text-5xl md:text-6xl font-bold mb-16 text-center">
            CONGRATULATIONS!
        </h2>

        <!-- Medal Image -->
        <div class="mb-10">
            <img
                    [src]="avatarPath"
                    alt="Winner Medal"
                    class="w-72 h-72 md:w-80 md:h-80 object-contain"
                    (error)="avatarPath = 'images/avatar.jpg'"
            />
        </div>

        <!-- Winner Name -->
        <div class="text-white text-5xl md:text-6xl font-bold mb-12 text-center">
            {{ winnerName }}
        </div>

        <!-- Stats Text -->
        <div class="text-white text-2xl md:text-3xl text-center leading-relaxed max-w-2xl px-4">
            <p class="font-medium">
                You answered <span class="font-bold text-[#19E6E8]">{{ totalQuestions }} questions</span> with<br />
                average <span class="font-bold text-[#19E6E8]">{{ averageTime }} seconds</span> per question,<br />
                placing <span class="font-bold text-[#19E6E8]">#{{ leaderboardPosition }}</span> on daily leaderboard!
            </p>
        </div>

    </div>

    <!-- Footer -->
    <div class="text-center text-[#7B8189] text-xl font-bold pb-8">
        Powered by FER | Projekt R
    </div>

</div>
