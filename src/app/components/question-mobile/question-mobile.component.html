<div
  class="min-h-screen w-screen bg-gradient-to-b from-[#1a2030] to-[#252a38] flex flex-col items-center justify-between overflow-hidden px-6 pb-12">
  <div class="text-center pt-16">
    <h1 class="text-5xl font-bold tracking-wider text-[#19E6E8]">
      UPRO<span class="text-[#19E6E8]">🗲</span>DUEL
    </h1>
  </div>

  <div class="flex-1 flex flex-col items-center justify-center w-full max-w-md">
    @if (questionData()) {
      @if (state() === 'waiting') {
        <div class="w-full text-center animate-in fade-in duration-500">
          <div class="text-[#7B8189] text-2xl font-medium mb-8 leading-relaxed">
            Read the code snippet<br/>on the main screen
          </div>
          <div class="w-full bg-[#3a4050] rounded-full h-3 mb-2">
            <div class="bg-[#19E6E8] h-3 rounded-full transition-all duration-75"
                 [style.width.%]="readingProgress()">
            </div>
          </div>
          <p class="text-[#19E6E8] text-xs font-bold uppercase tracking-widest animate-pulse">Get Ready</p>
        </div>
      }

      @if (state() === 'answering' || state() === 'locked') {
        <div class="w-full animate-in zoom-in duration-300">
          <div class="w-full grid grid-cols-2 gap-4">
            @for (answer of answers(); track answer.dbId) {
              <button
                (click)="onAnswerClick(answer.dbId)"
                [disabled]="state() === 'locked' || selectedAnswerId() !== null || correctAnswerId() !== null"
                [class]="answer.color + ' relative text-white font-bold py-10 rounded-2xl transition-all duration-500 shadow-lg flex flex-col items-center justify-center ' +
                (correctAnswerId() === answer.dbId ? 'scale-110 z-30 ring-8 ring-green-400 shadow-[0_0_40px_rgba(74,222,128,0.8)]' :
                 selectedAnswerId() === answer.dbId ? 'scale-110 z-20 ring-4 ring-white shadow-[0_0_30px_rgba(25,230,232,0.6)]' :
                 (correctAnswerId() !== null || selectedAnswerId() !== null) ? 'opacity-20 grayscale scale-90' : 'active:scale-95')"
              >
                <div class="text-5xl mb-2 font-black">{{ answer.label }}</div>
                <div class="text-[10px] font-bold uppercase opacity-70 truncate px-2 max-w-full">{{ answer.text }}</div>

                @if (correctAnswerId() === answer.dbId) {
                  <div
                    class="absolute -top-4 bg-green-500 text-white px-4 py-1 rounded-full text-[10px] font-black uppercase animate-bounce-small">
                    Correct
                  </div>
                } @else if (selectedAnswerId() === answer.dbId && correctAnswerId() !== null) {
                  <div
                    class="absolute -top-4 bg-red-500 text-white px-4 py-1 rounded-full text-[10px] font-black uppercase">
                    Wrong
                  </div>
                }
              </button>
            }
          </div>
        </div>
      }
    }
  </div>
</div>
