<div class="min-h-screen w-screen bg-gradient-to-b from-[#1a2030] to-[#252a38] flex flex-col items-center overflow-hidden px-6">

    <!-- Logo -->
    <div class="text-center pt-20">
        <h1 class="text-5xl md:text-6xl font-bold tracking-wider text-[#19E6E8]">
            UPRO<span class="text-[#19E6E8]">🗲</span>DUEL
        </h1>
    </div>

    <!-- Main Content -Fixed Center -->
    <div class="flex-1 flex flex-col items-center justify-center w-full max-w-md">

        <!-- Input Field Step 1: Game PIN -->
        @if (step() === 1) {
            <div class="w-full bg-[#1a1f2d] rounded-2xl p-8 mb-6">
                <input
                        type="text"
                        [(ngModel)]="gamePin"
                        placeholder="Game PIN"
                        maxlength="6"
                        class="w-full bg-transparent text-[#19E6E8] text-3xl text-center placeholder-[#19E6E8] placeholder-opacity-50 outline-none font-semibold"
                        (keyup.enter)="onEnterClick()"
                        autofocus
                />
            </div>
        }

        <!-- Input Field Step 3: Nickname -->
        @if (step() === 3) {
            <div class="w-full bg-[#1a1f2d] rounded-2xl p-8 mb-6">
                <input
                        type="text"
                        [(ngModel)]="nickname"
                        placeholder="Nickname"
                        maxlength="20"
                        class="w-full bg-transparent text-[#19E6E8] text-3xl text-center placeholder-[#19E6E8] placeholder-opacity-50 outline-none font-semibold"
                        (keyup.enter)="onEnterClick()"
                        autofocus
                />
            </div>
        }

        <!-- Display Value Step 4: Ready -->
        @if (step() === 4) {
            <div class="w-full bg-[#1a1f2d] rounded-2xl p-8 mb-6">
                <div class="text-[#19E6E8] text-4xl text-center font-bold">
                    {{ nickname }}
                </div>
            </div>
        }

        <!-- Enter Button -->
        <button
                (click)="onEnterClick()"
                class="w-full bg-[#1a1f2d] text-white text-2xl font-semibold py-6 rounded-2xl hover:bg-[#20252f] transition-colors"
        >
            Enter
        </button>

    </div>

    <!-- Bottom Section - Fixed Height -->
    <div class="w-full flex flex-col items-center pb-8">
        <!-- Joined Room Message - Always takes space -->
        <div class="h-10 flex items-center justify-center mb-2">
            @if (showJoinedMessage()) {
                <div class="text-[#19E6E8] text-xl font-semibold">
                    Joined room {{ gamePin }}
                </div>
            }
        </div>

        <!-- Footer -->
        <div class="text-center text-[#7B8189] text-lg font-bold">
            Powered by FER | Projekt R
        </div>
    </div>

</div>
